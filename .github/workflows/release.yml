name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import json;print(json.load(open('custom_components/garmin_dashboard/manifest.json'))['version'])")
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build panel
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Zip the integration
        # HACS expects the integration's files at the root of the zip.
        run: |
          cd custom_components/garmin_dashboard
          test -f www/garmin-dashboard-panel.js
          zip -r "$GITHUB_WORKSPACE/garmin_dashboard.zip" . -x "__pycache__/*" "*/__pycache__/*"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" garmin_dashboard.zip --clobber
